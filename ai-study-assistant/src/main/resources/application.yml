spring:
  application:
    name: ai-study-assistant
  datasource:
    url: jdbc:mysql://localhost:3307/ai_study_assistant
    username: root
    password: ${DB_PASSWORD}
  ai:
    retry:
      max-attempts: 1
      backoff:
        initial-interval: 1s
    model:
      chat: deepseek
      embedding: ollama
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: qwen3-embedding:0.6b
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: study_note_chunks_v1
        initialize-schema: false
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 60s
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
app:
  jwt:
    secret: ${JWT_SECRET}
  qdrant-sync:
    enabled: ${QDRANT_SYNC_ENABLED:true}
  qdrant-search:
    enabled: ${QDRANT_SEARCH_ENABLED:true}
